<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autos Colombia</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <h1>Parqueadero Autos Colombia</h1>

        <!-- ITERACIÓN 1 -->

        <h2>Registro de Entrada de Vehículos</h2>

        <form id="formulario">

            <label>Placa</label>
            <input type="text" id="placa" required>

            <label>Marca</label>
            <input type="text" id="marca" required>

            <label>Color</label>
            <input type="text" id="color" required>

            <label>Celda</label>

            <select id="celda">
                <option>Celda 1</option>
                <option>Celda 2</option>
                <option>Celda 3</option>
                <option>Celda 4</option>
            </select>

            <button type="submit">
                Registrar Entrada
            </button>

        </form>

        <h2>Vehículos Registrados</h2>

        <table id="tabla">

            <thead>
                <tr>
                    <th>Placa</th>
                    <th>Marca</th>
                    <th>Color</th>
                    <th>Celda</th>
                </tr>
            </thead>

            <tbody>

            </tbody>

        </table>

        <hr>

        <!-- ITERACIÓN 2 -->

        <h2>Gestión de Usuarios</h2>

        <form id="formUsuario">

            <label>Nombre</label>
            <input type="text" id="nombreUsuario" required>

            <label>Correo</label>
            <input type="email" id="correoUsuario" required>

            <label>Rol</label>

            <select id="rolUsuario">
                <option>Administrador</option>
                <option>Operador</option>
            </select>

            <button type="button" onclick="registrarUsuario()">
                Registrar Usuario
            </button>

        </form>

        <h3>Usuarios Registrados</h3>

        <table id="tablaUsuarios">

            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Rol</th>
                </tr>
            </thead>

            <tbody>

            </tbody>

        </table>

        <hr>

        <h2>Gestión de Celdas</h2>

        <form id="formCelda">

            <label>Número de Celda</label>
            <input type="text" id="numeroCelda" required>

            <label>Estado</label>

            <select id="estadoCelda">
                <option>Disponible</option>
                <option>Ocupada</option>
            </select>

            <button type="button" onclick="registrarCelda()">
                Registrar Celda
            </button>

        </form>

        <h3>Celdas Registradas</h3>

        <table id="tablaCeldas">

            <thead>
                <tr>
                    <th>Número</th>
                    <th>Estado</th>
                </tr>
            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>

</html>
